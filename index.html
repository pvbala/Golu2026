<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Golu</title>
  <meta name="description" content="Golu's videos">

  <!-- App install (Android + iPhone) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2A4A">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Golu">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <!-- Font (falls back to the phone's rounded system font if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="title" class="wordmark">Golu</h1>
    <p id="summary" class="summary">Loading…</p>
  </header>

  <main>
    <ul id="grid" class="grid" aria-label="Videos"></ul>
    <p id="status" class="status" hidden></p>
  </main>

  <!-- Video player (opens over the grid) -->
  <div id="player" class="player" role="dialog" aria-modal="true" aria-labelledby="player-title" hidden>
    <div class="player-bar">
      <button id="close" class="round-btn" type="button" aria-label="Close video">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <h2 id="player-title" class="player-title"></h2>
    </div>

    <div class="stage">
      <video id="video" controls playsinline preload="metadata"></video>
      <p id="video-error" class="video-error" hidden></p>
    </div>

    <div class="player-nav">
      <button id="prev" class="nav-btn" type="button">Previous</button>
      <button id="next" class="nav-btn" type="button">Next video</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
